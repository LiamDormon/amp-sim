# For now this is just a smoke test
name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Gradle build
      run: |
        chmod +x ./gradlew
        ./gradlew build