name: CI Build and test

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-26.04 # We rely on libadwaita features that are only available in Gnome 49 and later

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blueprint-compiler \
            libglib2.0-bin \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjack-jackd2-dev \ 
            jackd2 \
            xvfb

      - name: Verify native tools
        run: |
          blueprint-compiler --version
          glib-compile-resources --version
          jackd --version
          xvfb-run --help >/dev/null

      - name: Start JACK dummy server
        run: |
          export JACK_NO_AUDIO_RESERVATION=1
          jackd --no-realtime -d dummy -r 48000 -p 1024 &
          disown
          timeout 10 jack_wait -w
          echo "JACK dummy server is up."

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        run: |
          chmod +x ./gradlew
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./gradlew build
